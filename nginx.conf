server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Nota: o nginx NÃO herda add_header para dentro de um location que defina o seu próprio,
  # por isso os cabeçalhos de segurança estão num ficheiro incluído em todos os locations.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ =404;
  }
}
